# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = DejaVu Sans
$fg = rgba(210, 210, 210, 1.0)

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.7
    vibrancy = 0.17
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +'%A, %B %-d')</b>"
    font_size = 26
    font_family = $font
    color = $fg

    position = 0, 13%
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = <b>$TIME</b>
    font_size = 115
    font_family = $font
    color = $fg

    position = 0, 3%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 16%, 5%
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(255, 255, 255, 0.15)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(255, 90, 90, 0.25)

    font_color = $fg
    font_family = $font
    placeholder_text =
    fail_text = <i>$FAIL</i>
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -12%
    halign = center
    valign = center
}
